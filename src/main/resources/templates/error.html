<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="#{error.pageTitle}">Something went wrong — Darkhold</title>
    <link rel="icon" href="/images/favicon.png">
    <link rel="stylesheet" href="/styles/darkhold-styles.css">
    <link rel="stylesheet" href="/styles/error.css">
    <script src="/scripts/theme-manager.js"></script>
</head>
<body class="error-page">
    <main class="error-container">
        <div class="error-content" role="alert">
            <a class="error-brand" href="/">✦ Darkhold</a>
            <p class="error-code" th:text="${status}">500</p>
            <h1 class="error-title" th:text="${#messages.msg('error.' + errorMessageStatus + '.title')}">Something went wrong</h1>
            <p class="error-message" th:text="${#messages.msg('error.' + errorMessageStatus + '.message')}">Please try again.</p>
            <div class="error-actions">
                <button type="button" onclick="history.back()" class="error-btn error-btn--secondary" th:text="#{error.back}">Go back</button>
                <a href="/login" class="error-btn error-btn--primary" th:if="${status == 401 || status == 403}" th:text="#{login.signIn}">Sign in</a>
                <a href="/" class="error-btn error-btn--primary" th:unless="${status == 401 || status == 403}" th:text="#{error.home}">Go to homepage</a>
            </div>
        </div>
    </main>
</body>
</html>
