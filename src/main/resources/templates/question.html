<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${#locale.language}">
<head>
    <title>Next Question - Kahvoid</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="manifest" href="/manifest.json">
    <link rel="shortcut icon" href="/images/favicon.png">
    <link href="/styles/darkhold-styles.css" rel="stylesheet" />
    <link href="/styles/question-waiting.css" rel="stylesheet" />
    <script type="text/javascript" src="/scripts/theme-manager.js"></script>
    <script type="text/javascript" src="/scripts/language-manager.js"></script>
    <script type="text/javascript" src="/scripts/common-scripts.js"></script>
    <script type="text/javascript" src="/scripts/csrf-manager.js"></script>
    <script type="text/javascript" src="/scripts/audio-manager.js"></script>
    <script type="text/javascript" src="/scripts/accessibility.js"></script>
    <script type="text/javascript" src="/scripts/core/sockjs.min.js"></script>
    <script type="text/javascript" src="/scripts/core/stomp.min.js"></script>
    <script type="text/javascript" src="/scripts/question-scripts.js"></script>
    <script th:replace="~{fragments/i18n :: messages}"></script>
</head>
<body onload="connect()">
    <input type="hidden" th:value="${#authentication.getPrincipal().getUsername()}" id="name"/>
    <input type="hidden" th:value="${quizPin}" id="quizPin" name="quizPin"/>

    <form action="#" method="post">
        <input type="hidden" th:value="${quizPin}" name="quizPin"/>

        <div class="question-waiting-page">
            <!-- Animated particles background -->
            <div class="particles-bg">
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
            </div>

            <div class="question-waiting-content">
                <div class="question-waiting-card">

                    <!-- Icon -->
                    <div class="waiting-icon-container">
                        <div class="waiting-icon">
                            <i class="fas fa-bolt"></i>
                        </div>
                    </div>

                    <!-- Status Banner -->
                    <div class="status-banner">
                        <div class="status-banner-icon">
                            <i class="fas fa-clock"></i>
                        </div>
                        <span class="status-banner-text" th:text="#{questionWait.status}">Waiting for next question...</span>
                    </div>

                    <!-- Main Message (dynamically updated) -->
                    <div id="div_body">
                        <h1 class="waiting-message" th:text="#{questionWait.title}">Get Ready!</h1>
                        <p class="waiting-subtext" th:text="#{questionWait.subtitle}">The next question is loading</p>
                    </div>

                    <!-- Progress Indicator -->
                    <div class="progress-indicator">
                        <div class="progress-dot"></div>
                        <div class="progress-dot"></div>
                        <div class="progress-dot"></div>
                    </div>

                    <!-- Quick Tips -->
                    <div class="waiting-tips">
                        <div class="tips-grid">
                            <div class="tip-item-small">
                                <i class="fas fa-tachometer-alt"></i>
                                <span class="tip-text-small" th:text="#{questionWait.tipSpeed}">Speed Bonus</span>
                            </div>
                            <div class="tip-item-small">
                                <i class="fas fa-fire"></i>
                                <span class="tip-text-small" th:text="#{questionWait.tipStreak}">Streak Multiplier</span>
                            </div>
                            <div class="tip-item-small">
                                <i class="fas fa-trophy"></i>
                                <span class="tip-text-small" th:text="#{questionWait.tipPoints}">Earn Points</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </form>

    <script type="text/javascript" src="/scripts/core/bootstrap-5.3.1/bootstrap.bundle.min.js"></script>

    <script>
        // Texts arrive from the network, so build the nodes with textContent
        function showWaitingMessage(title, subtext) {
            const heading = document.createElement('h1');
            heading.className = 'waiting-message';
            heading.textContent = title;
            const sub = document.createElement('p');
            sub.className = 'waiting-subtext';
            sub.textContent = subtext;
            document.getElementById('div_body').replaceChildren(heading, sub);
        }

        let questionHandled = false;

        function updateTextOrEndGame(message) {
            // Every client's fetch is broadcast to the whole room: act on the first copy only
            if (questionHandled) {
                return;
            }
            questionHandled = true;
            if (message === "END_GAME") {
                showWaitingMessage(LanguageManager.text('client.questionWait.gameComplete'),
                    LanguageManager.text('client.questionWait.calculating'));
                setTimeout(endGame, 2000);
                return;
            }
            showWaitingMessage(message, LanguageManager.text('client.questionWait.prepare'));
            setTimeout(startGame, 3000);
        }
    </script>
</body>
</html>
