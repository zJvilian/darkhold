<!DOCTYPE HTML>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="en" th:lang="${#locale.language}">
<head>
    <title th:text="#{quizList.title}">My quizzes - Kahvoid</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="manifest" href="/manifest.json">
    <link rel="shortcut icon" href="/images/favicon.png">
    <link rel="stylesheet" href="/styles/darkhold-styles.css" />
    <link rel="stylesheet" href="/styles/view-challenges.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" >
    <meta name="_csrf" th:content="${_csrf.token}">
    <script src="/scripts/csrf-manager.js"></script>
    <script type="text/javascript" src="/scripts/theme-manager.js"></script>
    <script type="text/javascript" src="/scripts/audio-manager.js"></script>
    <script type="text/javascript" src="/scripts/language-manager.js"></script>
    <script type="text/javascript" src="/scripts/accessibility.js"></script>
    <script type="text/javascript" src="/scripts/view-challenges-scripts.js"></script>
    <script type="text/javascript" src="/scripts/common-scripts.js"></script>
    <script th:replace="~{fragments/i18n :: messages}"></script>
</head>
<body>
    <div th:insert="~{navbar :: navbar}"></div>

    <main class="view-challenges-page">
        <div class="view-challenges-container">
            <form id="challengeListForm" action="/preconfigure" th:object="${challengeInfo}" method="GET">
                <input type="hidden" th:name="challenges" id="challenges"/>

                <!-- Page Header -->
                <header class="view-challenges-header">
                    <h1 class="view-challenges-title" th:text="#{quizList.title}">My quizzes</h1>
                    <p class="view-challenges-subtitle" th:text="#{quizList.subtitle}">Browse, edit, and manage your quizzes</p>
                </header>

                <section th:if="${challengeInfo.challengeSummaryList != null and !#lists.isEmpty(challengeInfo.challengeSummaryList)}">
                    <div th:replace="~{fragments/quiz-list :: quizList(${challengeInfo.challengeSummaryList}, true)}"></div>
                </section>

                <!-- Empty State -->
                <div class="empty-state" th:if="${challengeInfo.challengeSummaryList == null or #lists.isEmpty(challengeInfo.challengeSummaryList)}">
                    <div class="empty-state-icon">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    <h3 class="empty-state-title" th:text="#{quizList.emptyTitle}">No quizzes yet</h3>
                    <p class="empty-state-text" th:text="#{quizList.emptyDescription}">Create your first quiz to get started</p>
                    <a href="/challenge/create" class="btn-primary-create">
                        <i class="fas fa-plus-circle"></i>
                        <span th:text="#{quizList.create}">Create quiz</span>
                    </a>
                </div>

                <!-- Delete Confirmation Modal -->
                <div id="confirmModal" class="modal fade" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="confirmModalLabel" th:text="#{challenge.view.confirmDelete}">Are you sure?</h5>
                                <button type="button" id="closeConfirmModal" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <p th:text="#{quizList.deleteWarning}">Do you really want to delete this quiz? This process cannot be undone.</p>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{button.cancel}">Cancel</button>
                                <button type="button" class="btn btn-danger" onclick="deleteQuiz();" th:text="#{challenge.view.delete}">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script type="text/javascript" src="/scripts/core/jquery-3.7.0.min.js"></script>

    <script type="text/javascript" src="/scripts/core/bootstrap-5.3.1/bootstrap.bundle.min.js"></script>
</body>
</html>
