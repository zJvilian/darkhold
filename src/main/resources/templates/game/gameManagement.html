<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en" th:lang="${#locale.language}">
<head>
    <title th:text="#{gameManagement.title} + ' - Kahvoid'">Game Management - Kahvoid</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" href="/images/favicon.png">
    <link href="/styles/darkhold-styles.css" rel="stylesheet" />
    <link href="/styles/admin-layout.css" rel="stylesheet" />
    <script type="text/javascript" src="/scripts/theme-manager.js"></script>
    <script type="text/javascript" src="/scripts/audio-manager.js"></script>
    <script type="text/javascript" src="/scripts/language-manager.js"></script>
    <script type="text/javascript" src="/scripts/accessibility.js"></script>
    <script type="text/javascript" src="/scripts/common-scripts.js"></script>
    <script th:replace="~{fragments/i18n :: messages}"></script>
</head>
<body class="admin-page">
    <div th:insert="~{navbar :: navbar}"></div>

    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-header">
            <h2 class="admin-sidebar-title">
                <i class="fas fa-shield-alt"></i>
                <span th:text="#{admin.title}">Admin Panel</span>
            </h2>
        </div>
        <nav class="admin-sidebar-nav">
            <div class="admin-nav-section">
                <div class="admin-nav-section-label" th:text="#{admin.main}">Main</div>
                <a href="/options" class="admin-nav-item">
                    <i class="fas fa-home"></i>
                    <span th:text="#{admin.dashboard}">Dashboard</span>
                </a>
            </div>
            <div class="admin-nav-section">
                <div class="admin-nav-section-label" th:text="#{admin.management}">Management</div>
                <a href="/userManagement" class="admin-nav-item" sec:authorize="hasAuthority('ADMIN')">
                    <i class="fas fa-users"></i>
                    <span th:text="#{admin.users}">Users</span>
                </a>
                <a href="/options" class="admin-nav-item">
                    <i class="fas fa-clipboard-list"></i>
                    <span th:text="#{admin.challenges}">Challenges</span>
                </a>
                <a href="/activegames" class="admin-nav-item">
                    <i class="fas fa-gamepad"></i>
                    <span th:text="#{admin.activeGames}">Active Games</span>
                </a>
                <a href="/pastgames" class="admin-nav-item">
                    <i class="fas fa-history"></i>
                    <span th:text="#{admin.pastGames}">Past Games</span>
                </a>
            </div>
            <div class="admin-nav-section">
                <div class="admin-nav-section-label" th:text="#{admin.system}">System</div>
                <a href="/options" class="admin-nav-item">
                    <i class="fas fa-cog"></i>
                    <span th:text="#{admin.settings}">Settings</span>
                </a>
            </div>
        </nav>
    </aside>

    <!-- Admin Content -->
    <main class="admin-content">
        <!-- Page Header -->
        <div class="admin-content-header">
            <div class="admin-breadcrumb">
                <a href="/options" th:text="#{admin.home}">Home</a>
                <span class="admin-breadcrumb-separator">/</span>
                <span th:text="#{gameManagement.title}">Game Management</span>
            </div>
            <h1 class="admin-page-title" th:text="#{gameManagement.title}">Game Management</h1>
            <p class="admin-page-subtitle" th:text="#{gameManagement.subtitle}">Monitor and manage active games</p>
        </div>

        <div class="alert alert-success" th:if="${param.saved}" th:text="#{gameManagement.saved}" role="status">Saved</div>
        <div class="alert alert-danger" th:if="${param.invalid}" th:text="#{gameManagement.invalid}" role="alert">Invalid</div>

        <div class="admin-card">
            <form method="post" action="/gameManagement" th:action="@{/gameManagement}" style="max-width: 32rem; padding: 1.5rem;">
                <div class="mb-3">
                    <label for="timerSeconds" class="form-label" th:text="#{gameManagement.timerSeconds}">Default question timer (seconds)</label>
                    <input type="number" class="form-control" id="timerSeconds" name="timerSeconds" min="5" max="240" required
                           th:value="${timerSeconds}" aria-describedby="timerHelp">
                    <div id="timerHelp" class="form-text" th:text="#{gameManagement.timerHelp}"></div>
                </div>
                <div class="mb-3">
                    <label for="pinLength" class="form-label" th:text="#{gameManagement.pinLength}">Game PIN length</label>
                    <input type="number" class="form-control" id="pinLength" name="pinLength" min="4" max="8" required
                           th:value="${pinLength}" aria-describedby="pinHelp">
                    <div id="pinHelp" class="form-text" th:text="#{gameManagement.pinHelp}"></div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i>
                    <span th:text="#{gameManagement.save}">Save settings</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Mobile Sidebar Toggle -->
    <button class="admin-sidebar-toggle" onclick="toggleAdminSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <script type="text/javascript" src="/scripts/core/jquery-3.7.0.min.js"></script>

    <script type="text/javascript" src="/scripts/core/bootstrap-5.3.1/bootstrap.bundle.min.js"></script>
    <script>
        function toggleAdminSidebar() {
            const sidebar = document.getElementById('adminSidebar');
            sidebar.classList.toggle('active');
        }
    </script>
</body>
</html>
