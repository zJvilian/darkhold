# PostgreSQL Production Configuration
# Usage: docker compose up -d

services:
  darkhold:
    build: .
    image: darkhold:local
    container_name: darkhold
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${DARKHOLD_BIND_ADDRESS:-127.0.0.1}:8181:8181"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DATABASE_URL=jdbc:postgresql://db:5432/darkhold
      - DATABASE_USER=darkhold
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - DARKHOLD_ADMIN_PASSWORD=${DARKHOLD_ADMIN_PASSWORD:-}
      - JAVA_OPTS=-Xmx512m
      - DARKHOLD_PUBLIC_BASE_URL=${DARKHOLD_PUBLIC_BASE_URL:-}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
      - OIDC_ISSUER_URI=${OIDC_ISSUER_URI:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      # An empty value would override the application default, so repeat the defaults here
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME:-SSO}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid,profile,email}
    volumes:
      - question_images:/app/question-images
      - user_photos:/app/user-photos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: darkhold-db
    environment:
      - POSTGRES_DB=darkhold
      - POSTGRES_USER=darkhold
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkhold -d darkhold"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  question_images:
    driver: local
  user_photos:
    driver: local
