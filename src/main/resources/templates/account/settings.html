<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${#locale.language}">
<head>
    <title th:text="#{account.settings} + ' - Kahvoid'">Account Settings - Kahvoid</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" href="/images/favicon.png">
    <link href="/styles/darkhold-styles.css" rel="stylesheet" />
    <link href="/styles/account-settings.css" rel="stylesheet" />
    <script type="text/javascript" src="/scripts/theme-manager.js"></script>
    <script type="text/javascript" src="/scripts/audio-manager.js"></script>
    <script type="text/javascript" src="/scripts/language-manager.js"></script>
    <script type="text/javascript" src="/scripts/accessibility.js"></script>
    <script type="text/javascript" src="/scripts/common-scripts.js"></script>
    <script th:replace="~{fragments/i18n :: messages}"></script>
</head>
<body>
    <div th:insert="~{navbar :: navbar}"></div>

    <main class="account-settings-page">
        <div class="account-container">
            <!-- Page Header -->
            <header class="account-header">
                <h1 class="account-title">Account Settings</h1>
                <p class="account-subtitle">Manage your profile and preferences</p>
            </header>

            <!-- Profile Section -->
            <section class="settings-section">
                <div class="settings-section-header">
                    <h2 class="settings-section-title">
                        <i class="fas fa-user-circle"></i>
                        Profile Information
                    </h2>
                </div>
                <div class="settings-section-body">
                    <div class="profile-info-grid">
                        <div class="profile-info-item">
                            <span class="profile-info-label">Username</span>
                            <span class="profile-info-value" th:text="${#authentication.getPrincipal().getUsername()}">user@example.com</span>
                        </div>
                        <div class="profile-info-item">
                            <span class="profile-info-label">Account Type</span>
                            <span class="profile-info-value">
                                <span class="badge badge-primary" th:each="role : ${#authentication.getPrincipal().getAuthorities()}"
                                      th:text="${role.authority}">ROLE_USER</span>
                            </span>
                        </div>
                    </div>
                    <div th:if="${message != null}" class="alert alert-success" role="status" th:text="#{${message}}"></div>
                    <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert" th:text="#{${errorMessage}}"></div>
                    <div class="settings-actions">
                        <details>
                            <summary class="btn btn-secondary"><i class="fas fa-edit"></i> <span th:text="#{account.editProfile}">Edit Profile</span></summary>
                            <form th:action="@{/account/profile}" method="post" enctype="multipart/form-data" class="mt-3">
                                <img th:src="@{${#authentication.getPrincipal().getUser().photosImagePath}}" th:alt="#{user.profilePhoto}" alt="Profile photo"
                                     width="64" height="64" style="border-radius: 50%; object-fit: cover;" />
                                <label class="settings-option-label" for="firstName" th:text="#{user.firstName}">First name</label>
                                <input class="form-control" id="firstName" name="firstName" maxlength="64" required
                                       th:value="${#authentication.getPrincipal().getUser().firstName}" />
                                <label class="settings-option-label" for="lastName" th:text="#{user.lastName}">Last name</label>
                                <input class="form-control" id="lastName" name="lastName" maxlength="64" required
                                       th:value="${#authentication.getPrincipal().getUser().lastName}" />
                                <label class="settings-option-label" for="email" th:text="#{user.email}">Email</label>
                                <input class="form-control" type="email" id="email" name="email" maxlength="128" required
                                       th:value="${#authentication.getPrincipal().getUser().email}" />
                                <label class="settings-option-label" for="profilePassword" th:text="#{account.passwordForEmail}">Current password (only needed to change the email)</label>
                                <input class="form-control" type="password" id="profilePassword" name="currentPassword"
                                       autocomplete="current-password" />
                                <label class="settings-option-label" for="image" th:text="#{account.profilePicture}">Profile picture</label>
                                <input class="form-control" type="file" id="image" name="image"
                                       accept=".png,.jpg,.jpeg,.gif,image/png,image/jpeg,image/gif" />
                                <button type="submit" class="btn btn-primary mt-2" th:text="#{user.save}">Save</button>
                            </form>
                        </details>
                        <details>
                            <summary class="btn btn-secondary"><i class="fas fa-key"></i> <span th:text="#{account.changePassword}">Change Password</span></summary>
                            <form th:action="@{/account/password}" method="post" class="mt-3">
                                <label class="settings-option-label" for="currentPassword" th:text="#{account.currentPassword}">Current password</label>
                                <input class="form-control" type="password" id="currentPassword" name="currentPassword"
                                       autocomplete="current-password" required />
                                <label class="settings-option-label" for="newPassword" th:text="#{account.newPassword}">New password</label>
                                <input class="form-control" type="password" id="newPassword" name="newPassword"
                                       autocomplete="new-password" minlength="8" maxlength="32" required />
                                <label class="settings-option-label" for="confirmPassword" th:text="#{account.confirmPassword}">Confirm new password</label>
                                <input class="form-control" type="password" id="confirmPassword" name="confirmPassword"
                                       autocomplete="new-password" required />
                                <button type="submit" class="btn btn-primary mt-2" th:text="#{account.changePasswordSubmit}">Change password</button>
                            </form>
                        </details>
                    </div>
                </div>
            </section>

            <!-- Preferences Section -->
            <section class="settings-section">
                <div class="settings-section-header">
                    <h2 class="settings-section-title">
                        <i class="fas fa-sliders-h"></i>
                        Preferences
                    </h2>
                </div>
                <div class="settings-section-body">
                    <div class="settings-options">
                        <div class="settings-option">
                            <div class="settings-option-info">
                                <label class="settings-option-label">Theme</label>
                                <p class="settings-option-desc">Choose your preferred theme</p>
                            </div>
                            <div class="settings-option-control">
                                <button class="btn-icon" onclick="toggleTheme()" id="theme-toggle-btn-settings">
                                    <i class="fas fa-moon" id="theme-icon-settings"></i>
                                </button>
                            </div>
                        </div>
                        <div class="settings-option">
                            <div class="settings-option-info">
                                <label class="settings-option-label">Sound Effects</label>
                                <p class="settings-option-desc">Play sounds during games</p>
                            </div>
                            <div class="settings-option-control">
                                <button class="btn-icon" onclick="toggleSound()" id="sound-toggle-btn-settings">
                                    <i class="fas fa-volume-up" id="sound-icon-settings"></i>
                                </button>
                            </div>
                        </div>
                        <div class="settings-option">
                            <div class="settings-option-info">
                                <label class="settings-option-label">Language</label>
                                <p class="settings-option-desc">Select your language</p>
                            </div>
                            <div class="settings-option-control">
                                <select class="form-select" onchange="changeLanguage(this.value)">
                                    <option value="en" th:selected="${#locale.language == 'en'}">English</option>
                                    <option value="es" th:selected="${#locale.language == 'es'}">Español</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Data & Privacy Section -->
            <section class="settings-section">
                <div class="settings-section-header">
                    <h2 class="settings-section-title">
                        <i class="fas fa-shield-alt"></i>
                        Data & Privacy
                    </h2>
                </div>
                <div class="settings-section-body">
                    <div class="settings-actions">
                        <button class="btn btn-secondary" onclick="alert('Export data feature coming soon!')">
                            <i class="fas fa-download"></i>
                            Export My Data
                        </button>
                        <button class="btn btn-danger" onclick="confirmDeleteAccount()">
                            <i class="fas fa-trash"></i>
                            Delete Account
                        </button>
                    </div>
                </div>
            </section>

            <!-- Back Button -->
            <div class="account-footer">
                <button class="btn btn-secondary" onclick="window.history.back()">
                    <i class="fas fa-arrow-left"></i>
                    Back
                </button>
            </div>
        </div>
    </main>

    <script type="text/javascript" src="/scripts/core/jquery-3.7.0.min.js"></script>

    <script type="text/javascript" src="/scripts/core/bootstrap-5.3.1/bootstrap.bundle.min.js"></script>
    <script>
        // Sync theme icon in settings
        function updateThemeIconSettings() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const icon = document.getElementById('theme-icon-settings');
            if (icon) {
                icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            }
        }

        // Sync sound icon in settings
        function updateSoundIconSettings() {
            const isMuted = localStorage.getItem('sound-enabled') === 'false';
            const icon = document.getElementById('sound-icon-settings');
            if (icon) {
                icon.className = isMuted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            updateThemeIconSettings();
            updateSoundIconSettings();
        });

        function confirmDeleteAccount() {
            if (confirm('Are you sure you want to delete your account? This action cannot be undone.')) {
                alert('Account deletion feature will be implemented soon.');
            }
        }
    </script>
</body>
</html>
