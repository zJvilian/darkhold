<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${#locale.language}">
<head>
    <title th:text="#{offline.title}">Offline - Kahvoid Quiz</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="manifest" href="/manifest.json">
    <link rel="shortcut icon" href="/images/favicon.png">
    <link href="/styles/darkhold-styles.css" rel="stylesheet" />
    <link href="/styles/offline.css" rel="stylesheet" />
    <script type="text/javascript" src="/scripts/theme-manager.js"></script>
</head>
<body class="offline-page">
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1 class="offline-title" th:text="#{offline.heading}">You're Offline</h1>
        <p class="offline-message" th:text="#{offline.message}">
            It looks like you've lost your internet connection. Please check your connection and try again.
        </p>
        <button class="retry-btn" onclick="window.location.reload();">
            <i class="fas fa-redo"></i>
            <span th:text="#{offline.tryAgain}">Try Again</span>
        </button>

        <div class="offline-tips">
            <div class="offline-tips-title" th:text="#{offline.tipsTitle}">Quick Tips:</div>
            <ul class="offline-tips-list">
                <li th:text="#{offline.tip1}">Check your WiFi or mobile data</li>
                <li th:text="#{offline.tip2}">Try disabling airplane mode</li>
                <li th:text="#{offline.tip3}">Restart your router if needed</li>
            </ul>
        </div>
    </div>
</body>
</html>
