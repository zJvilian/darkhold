# ===========================================
# Darkhold - Default Configuration (H2 Development)
# ===========================================

# Server
server.port=8181
server.error.whitelabel.enabled=false
# Honor X-Forwarded-* only from trusted (private-range) proxies, so rate limits can't be bypassed by spoofing
server.forward-headers-strategy=native

# Thymeleaf
spring.thymeleaf.cache=false

# ===========================================
# Internationalization (i18n)
# ===========================================
spring.messages.basename=messages,validation
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600
spring.messages.fallback-to-system-locale=false

# ===========================================
# Database - H2 (Default for Development)
# ===========================================
spring.datasource.url=jdbc:h2:mem:darkhold;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console is off by default (it would expose the database); enable only on a throwaway local setup
spring.h2.console.enabled=false

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# Flyway disabled for H2 (uses schema.sql/data.sql)
spring.flyway.enabled=false

# ===========================================
# Game Configuration
# ===========================================
darkhold.game.timer-seconds=20
darkhold.game.pin-length=5

# Game expiration settings (for automatic cleanup)
# Games in WAITING status expire after this many hours (default: 2)
darkhold.game.waiting-expiration-hours=2
# Games in IN_PROGRESS or PAUSED status expire after this many hours (default: 24)
darkhold.game.expiration-hours=24

# ===========================================
# File Upload Configuration
# ===========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.enabled=true
# Logins live in the database for 10 days of inactivity; expired rows are deleted automatically.
spring.session.timeout=10d

# ===========================================
# Media Storage Configuration
# ===========================================
darkhold.media.question-images-dir=question-images
darkhold.media.max-image-width=1200
darkhold.media.max-image-height=800

# ===========================================
# Application Settings
# ===========================================
admin.as_participant=true

# ===========================================
# Security - Rate Limiting Configuration
# ===========================================
# Maximum failed PIN attempts before blocking (default: 5)
darkhold.security.rate-limit.max-attempts=5
# Time window in seconds for counting attempts (default: 300 = 5 minutes)
darkhold.security.rate-limit.window-seconds=300
# Block duration in seconds after max attempts exceeded (default: 900 = 15 minutes)
darkhold.security.rate-limit.block-duration-seconds=900
