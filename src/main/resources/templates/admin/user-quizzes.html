<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{user.viewQuizzes}">View quizzes</title>
    <link href="/styles/darkhold-styles.css" rel="stylesheet">
    <script src="/scripts/theme-manager.js"></script>
    <script src="/scripts/audio-manager.js"></script>
    <script src="/scripts/language-manager.js"></script>
    <script src="/scripts/accessibility.js"></script>
    <script src="/scripts/common-scripts.js"></script>
    <script src="/scripts/core/bootstrap-5.3.1/bootstrap.bundle.min.js"></script>
    <script th:replace="~{fragments/i18n :: messages}"></script>
</head>
<body>
<div th:insert="~{navbar :: navbar}"></div>
<main class="container py-4">
    <a th:href="@{/userManagement}" th:text="#{user.title}">Manage Users</a>
    <h1 th:text="#{user.viewQuizzes}">View quizzes</h1>
    <p th:text="${owner.email}"></p>
    <p th:if="${#lists.isEmpty(quizzes)}" th:text="#{user.noQuizzes}">This user owns no quizzes.</p>
    <details th:each="quiz : ${quizzes}" class="card p-3 mb-3">
        <summary><span th:text="${quiz.title}"></span> (#<span th:text="${quiz.id}"></span>)</summary>
        <p th:text="${quiz.description}"></p>
        <p th:if="${#lists.isEmpty(quiz.questionSets)}" th:text="#{user.noQuestions}">This quiz has no questions.</p>
        <ol>
            <li th:each="question : ${quiz.questionSets}" th:text="${question.question}"></li>
        </ol>
    </details>
</main>
</body>
</html>
